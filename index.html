<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6FD1">
<title>JANバーコード表示</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --blue:#1F6FD1; --blue-d:#1857A6; --ink:#1C2128; --sub:#5A6470; --line:#DDE2E8;
  --bg:#F2F4F7; --paper:#FFFFFF; --flag:#F2C200; --flagbg:#FFF6CC;
  --font:"BIZ UDPGothic","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

/* ===== 一覧 ===== */
#listView{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.top h1{margin:0 0 8px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1 small{font-size:12px;font-weight:400;opacity:.85}
.sbox{position:relative}
#q{width:100%;font:inherit;font-size:19px;border:0;border-radius:10px;padding:13px 44px 13px 14px;background:#fff;color:var(--ink)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#q::placeholder{color:#8A939E}
#qClear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;font-size:22px;color:#8A939E;display:none}
.cnt{font-size:13px;color:var(--sub);padding:8px 16px 4px}
#list{list-style:none;margin:0;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.it{display:block;width:100%;text-align:left;background:var(--paper);border:0;border-bottom:1px solid var(--line);padding:14px 16px;min-height:64px}
.it:active{background:#E6F0FC}
.it .n{font-weight:700;font-size:17px;line-height:1.35}
.it .m{font-size:13.5px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.ty{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px;color:#fff;background:var(--blue)}
.ty.fba{background:#C2410C}
.ty.lgl{background:#6D28D9}
.flag{display:inline-block;background:var(--flag);color:#1C2128;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.sec{font-size:13px;color:var(--sub);padding:12px 16px 6px;background:var(--bg)}
.empty{padding:28px 18px;color:var(--sub);line-height:1.7}

/* ===== バーコード画面 ===== */
#codeView{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:10}
#codeView.on{display:flex}
.cv-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:6px solid var(--blue)}
#codeView.fba .cv-top{border-bottom-color:#C2410C}
#codeView.lgl .cv-top{border-bottom-color:#6D28D9}
.cv-type{margin-bottom:10px}
.back{border:0;background:var(--bg);border-radius:10px;padding:12px 16px;font-size:17px;font-weight:700;min-width:96px}
.cv-top .ttl{font-size:13px;color:var(--sub);margin-left:auto;padding-right:8px;text-align:right}
.cv-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0;overflow:auto}
.cv-name{font-size:22px;font-weight:700;line-height:1.35;text-align:center;padding:0 18px}
.cv-code{font-size:15px;color:var(--sub);margin-top:4px;text-align:center}
.cv-flag{margin:12px 16px 0;background:var(--flagbg);border-left:6px solid var(--flag);padding:10px 12px;font-size:14px;line-height:1.55}
.bcwrap{margin-top:22px;background:#fff;display:flex;justify-content:center}
#bc{display:block}
.cv-num{font:600 22px/1 Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;margin-top:10px;font-variant-numeric:tabular-nums}
.cv-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px}
.nav{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 8px;font-size:16px;font-weight:700}
.nav:disabled{opacity:.35}
/* ===== 複数えらぶ ===== */
.top h1 .mbtn{margin-left:auto;white-space:nowrap;flex:none;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700}
.top.sel{background:#14498C}
.top.sel h1 .mbtn{background:#fff;color:#14498C}
.it.pick{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid #9AA3AE;display:grid;place-items:center;font-size:17px;font-weight:900;color:transparent}
.it.on .ck{background:var(--blue);border-color:var(--blue);color:#fff}
.it.on{background:#E6F0FC}
#selBar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;gap:10px;align-items:center}
#selBar.on{display:flex}
#selBar .c{font-size:15px;font-weight:700;flex:1}
#selBar .c small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.sb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 12px;font-size:15px;font-weight:700}
.sb.go{background:var(--blue);border-color:var(--blue);color:#fff;padding:12px 16px}
.sb:disabled{opacity:.4}
body.selmode #list{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ===== まとめて表示 ===== */
#multiView{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
#multiView.on{display:flex}
.mv-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:#fff;border-bottom:6px solid var(--blue)}
.mv-top .ttl{margin-left:auto;text-align:right;font-size:13px;color:var(--sub);padding-right:8px;line-height:1.35}
.mv-top .ttl b{display:block;font-size:16px;color:var(--ink)}
#mvList{flex:1;overflow:auto;padding:10px 10px 20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.mc{background:#fff;border:3px solid transparent;border-radius:12px;padding:8px 8px 6px;position:relative}
.mc.act{margin:10px 0}
.mc.act{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,209,.15)}
.mc.done:not(.act){background:#F7F8FA}
.mc .hd{display:flex;align-items:flex-start;gap:8px;padding:0 4px}
.mc .no{flex:none;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.mc.act .no{background:var(--blue)}
.mc .nm{flex:1;font-size:15px;font-weight:700;line-height:1.35}
.mc .cd{font-size:12.5px;color:var(--sub);font-weight:400;margin-top:1px}
.mc .dn{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;color:var(--sub)}
.mc.done .dn{background:#2F7D4F;border-color:#2F7D4F;color:#fff}
.mc .bw{display:flex;justify-content:center;margin-top:6px;position:relative}
.mc.act .bw{margin-top:10px}
.mc .bw svg{display:block}
.mc .num{text-align:center;font:600 16px/1 Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;margin-top:6px}
.mc:not(.act) .num{font-size:12.5px;margin-top:3px}
.mc:not(.act) .nm{font-size:14px}
.mc .veil span{padding:2px 12px;font-size:12px}
.mc:not(.act) .num{color:#9AA3AE}
.mc .veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.mc:not(.act) .veil{display:flex}
.mc .veil span{background:rgba(255,255,255,.92);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--sub)}
.mv-foot{background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.mv-foot .nav{flex:1}
.mv-foot .nav.go{flex:1.6;background:var(--blue);border-color:var(--blue);color:#fff}
.mv-tip{font-size:12.5px;color:var(--sub);text-align:center;padding:6px 16px 0;background:#fff}
.tip{font-size:12.5px;color:var(--sub);text-align:center;padding:0 16px 6px}
</style>
</head>
<body>

<div id="listView">
  <header class="top">
    <h1><span>JANバーコード表示<small id="meta" style="display:block;margin-top:1px"></small></span><button class="mbtn" id="selBtn" aria-pressed="false">複数えらぶ</button></h1>
    <div class="sbox">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="商品名・商品コード・番号で検索" autocomplete="off" aria-label="商品をさがす">
      <button id="qClear" aria-label="検索を消す">×</button>
    </div>
  </header>
  <div class="cnt" id="cnt"></div>
  <ul id="list" role="list"></ul>
</div>

<div id="selBar" role="region" aria-label="えらんだ商品">
  <div class="c" id="selCnt">0件えらび中<small>商品をタップしてえらびます</small></div>
  <button class="sb" id="selClear">全部はずす</button>
  <button class="sb go" id="selGo">まとめて表示</button>
</div>

<section id="multiView" aria-label="まとめて表示">
  <div class="mv-top">
    <button class="back" id="mvBack">← 一覧</button>
    <span class="ttl"><b id="mvTitle"></b>青い枠のバーコードを読ませてください</span>
  </div>
  <div class="mv-tip">読み間違いを防ぐため、くっきり出るのは<b>青い枠の1つだけ</b>です。ほかはタップすると切り替わります。</div>
  <div id="mvList"></div>
  <div class="mv-foot">
    <button class="nav" id="mvPrev">◀ 前へ</button>
    <button class="nav go" id="mvNext">済みにして次へ ▶</button>
  </div>
</section>

<section id="codeView" aria-live="polite">
  <div class="cv-top">
    <button class="back" id="back">← 一覧</button>
    <span class="ttl">スキャナーに<br>画面を向けてください</span>
  </div>
  <div class="cv-body">
    <div class="cv-type" id="cvType"></div><div class="cv-name" id="cvName"></div>
    <div class="cv-code" id="cvCode"></div>
    <div class="cv-flag" id="cvFlag" hidden></div>
    <div class="bcwrap"><svg id="bc" shape-rendering="crispEdges" role="img"></svg></div>
    <div class="cv-num" id="cvNum"></div>
  </div>
  <p class="tip">読めないときは、画面を明るくして、スキャナーから少し離してください。</p>
  <div class="cv-foot">
    <button class="nav" id="prev">◀ 前の商品</button>
    <button class="nav" id="next">次の商品 ▶</button>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ITEMS=[], view=[], cur=-1;

/* ---------- EAN-13 ---------- */
const L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const R=["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const PAR=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function validJan(s){if(!/^\d{13}$/.test(s))return false;let t=0;for(let i=0;i<12;i++)t+=(+s[i])*(i%2?3:1);return (10-t%10)%10===+s[12]}
function drawEAN(jan){
  const d=jan.split("").map(Number), p=PAR[d[0]];
  let bits="101"; for(let i=1;i<=6;i++) bits+=(p[i-1]==="L"?L:G)[d[i]];
  bits+="01010"; for(let i=7;i<=12;i++) bits+=R[d[i]]; bits+="101";
  const Q=11, total=bits.length+Q*2; // 95 + 左右の余白
  // 画面のピクセルにぴったり合う太さにして、にじみを防ぐ
  const dpr=window.devicePixelRatio||1;
  const avail=Math.min(window.innerWidth,520)-16;
  const modPx=Math.max(1,Math.floor(avail*dpr/total));
  const wCss=modPx*total/dpr, hCss=Math.min(wCss*0.55,window.innerHeight*0.32);
  let r=`<rect width="${total}" height="100" fill="#fff"/>`;
  for(let i=0;i<bits.length;){
    if(bits[i]!=="1"){i++;continue}
    let j=i;while(j<bits.length&&bits[j]==="1")j++;
    r+=`<rect x="${Q+i}" y="0" width="${j-i}" height="100" fill="#000"/>`;i=j;
  }
  const svg=$("bc");
  svg.setAttribute("viewBox",`0 0 ${total} 100`);
  svg.setAttribute("preserveAspectRatio","none");
  svg.style.width=wCss+"px"; svg.style.height=hCss+"px";
  svg.setAttribute("aria-label","JAN "+jan);
  svg.innerHTML=r;
}

/* ---------- Code128（Amazon用 FNSKU） ---------- */
const C128=["212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213", "221312", "231212", "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132", "221231", "213212", "223112", "312131", "311222", "321122", "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123", "131321", "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121", "313121", "211331", "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111", "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412", "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111", "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211", "212141", "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113", "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"];
function validFn(s){return /^(X0|B0)[0-9A-Z]{8}$/.test(s)}
function drawC128(v){
  const codes=[104]; for(const ch of v) codes.push(ch.charCodeAt(0)-32);
  let sum=104; for(let i=1;i<codes.length;i++) sum+=codes[i]*i; codes.push(sum%103); codes.push(106);
  const Q=10; let x=Q, r="";
  codes.forEach(c=>{const w=C128[c];for(let i=0;i<w.length;i++){const n=+w[i];if(i%2===0)r+=`<rect x="${x}" y="0" width="${n}" height="100" fill="#000"/>`;x+=n}});
  const total=x+Q;
  const dpr=window.devicePixelRatio||1, avail=Math.min(window.innerWidth,520)-16;
  const modPx=Math.max(1,Math.floor(avail*dpr/total));
  const wCss=modPx*total/dpr, hCss=Math.min(wCss*0.42,window.innerHeight*0.28);
  const svg=$("bc"); svg.setAttribute("viewBox",`0 0 ${total} 100`); svg.setAttribute("preserveAspectRatio","none");
  svg.style.width=wCss+"px"; svg.style.height=hCss+"px"; svg.setAttribute("aria-label","FNSKU "+v);
  svg.innerHTML=`<rect width="${total}" height="100" fill="#fff"/>`+r;
}

/* ---------- バーコードの図（まとめて表示用） ---------- */
function eanBits(jan){const d=jan.split("").map(Number),p=PAR[d[0]];let b="101";for(let i=1;i<=6;i++)b+=(p[i-1]==="L"?L:G)[d[i]];b+="01010";for(let i=7;i<=12;i++)b+=R[d[i]];return b+"101"}
function c128Runs(v){const codes=[104];for(const ch of v)codes.push(ch.charCodeAt(0)-32);let sum=104;for(let i=1;i<codes.length;i++)sum+=codes[i]*i;codes.push(sum%103);codes.push(106);let s="";codes.forEach(c=>{const w=C128[c];for(let i=0;i<w.length;i++)s+=(i%2===0?"1":"0").repeat(+w[i])});return s}
// faint=true のときは、ほとんど見えない薄い灰色で描く（スキャナーが読めないようにする）
function barMarkup(p,wMax,hCss,faint){
  const bits=p.t==="fba"?c128Runs(p.v):eanBits(p.v), Q=p.t==="fba"?10:11, total=bits.length+Q*2;
  const dpr=window.devicePixelRatio||1, modPx=Math.max(1,Math.floor(wMax*dpr/total)), wCss=modPx*total/dpr;
  const col=faint?"#ECEEF1":"#000";
  let r=`<rect width="${total}" height="100" fill="#fff"/>`;
  for(let i=0;i<bits.length;){if(bits[i]!=="1"){i++;continue}let j=i;while(j<bits.length&&bits[j]==="1")j++;r+=`<rect x="${Q+i}" y="0" width="${j-i}" height="100" fill="${col}"/>`;i=j}
  return `<svg viewBox="0 0 ${total} 100" preserveAspectRatio="none" shape-rendering="crispEdges" style="width:${wCss}px;height:${hCss}px" aria-hidden="${faint}">${r}</svg>`;
}

/* ---------- 検索 ---------- */
function norm(s){return (s||"").normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s　]+/g,"")}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function recent(){try{return JSON.parse(ls("jan-recent")||"[]")}catch(e){return []}}
function pushRecent(v){const r=recent().filter(x=>x!==v);r.unshift(v);ls("jan-recent",JSON.stringify(r.slice(0,8)))}
const TYPE={jan:"JAN",fba:"Amazon",lgl:"ロジレス"};
const TORDER={jan:0,fba:1,lgl:2};
function badge(p){return `<span class="ty ${p.t}">${TYPE[p.t]}</span>`}
let selMode=false; const SEL=[]; // えらんだ順に番号(v)を入れる
function row(p,i){
  if(selMode){const on=SEL.includes(p.v);return `<li><button class="it pick${on?" on":""}" data-i="${i}" aria-pressed="${on}"><span class="ck">✓</span><span><div class="n">${badge(p)}${esc(p.n)}${p.f?'<span class="flag">要確認</span>':""}</div><div class="m">${p.c?esc(p.c)+"　":""}${p.v}</div></span></button></li>`}
  return `<li><button class="it" data-i="${i}"><div class="n">${badge(p)}${esc(p.n)}${p.f?'<span class="flag">要確認</span>':""}</div><div class="m">${p.c?esc(p.c)+"　":""}${p.v}</div></button></li>`}
function render(){
  const raw=$("q").value; $("qClear").style.display=raw?"block":"none";
  const ks=raw.split(/[\s　]+/).map(norm).filter(Boolean);
  view=ITEMS.filter(p=>ks.every(k=>p.k.includes(k)));
  let html="";
  if(!ks.length){
    const rc=recent().map(v=>ITEMS.find(p=>p.v===v)).filter(Boolean);
    if(rc.length){
      html+=`<li class="sec">最近ひらいた商品</li>`+rc.map(p=>row(p,view.indexOf(p))).join("")+`<li class="sec">すべての商品</li>`;
    }
  }
  html+=view.map((p,i)=>row(p,i)).join("");
  $("list").innerHTML=view.length?html:`<li class="empty">見つかりませんでした。<br>言葉を短くするか、商品コードやJANの一部で探してください（例：キウイ、006、0420、amazon、ロジレス）。</li>`;
  $("cnt").textContent=ks.length?`${view.length}件 見つかりました`:`全${ITEMS.length}件`;
}
$("q").addEventListener("input",render);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){$("q").blur();if(view.length===1&&!selMode)open(0)}});
$("qClear").onclick=()=>{$("q").value="";render();$("q").focus()};
$("list").addEventListener("click",e=>{const b=e.target.closest(".it");if(!b)return;
  if(selMode){const v=view[+b.dataset.i].v,k=SEL.indexOf(v);if(k<0)SEL.push(v);else SEL.splice(k,1);render();updSel()}
  else open(+b.dataset.i)});
function updSel(){
  $("selCnt").innerHTML=`${SEL.length}件えらび中<small>${SEL.length?"えらんだ順に並びます":"商品をタップしてえらびます"}</small>`;
  $("selGo").disabled=!SEL.length; $("selClear").disabled=!SEL.length;
}
function setSelMode(on){
  selMode=on; document.body.classList.toggle("selmode",on);
  $("selBar").classList.toggle("on",on); document.querySelector(".top").classList.toggle("sel",on);
  $("selBtn").textContent=on?"やめる":"複数えらぶ"; $("selBtn").setAttribute("aria-pressed",on);
  render(); updSel();
}
$("selBtn").onclick=()=>setSelMode(!selMode);
$("selClear").onclick=()=>{SEL.length=0;render();updSel()};

/* ---------- まとめて表示 ---------- */
let MV=[], act=0; const DONE=new Set();
function mvCard(p,i){
  return `<div class="mc${i===act?" act":""}${DONE.has(p.v)?" done":""}" data-i="${i}">
    <div class="hd"><span class="no">${i+1}</span><div class="nm">${badge(p)}${esc(p.n)}${p.f?'<span class="flag">要確認</span>':""}<div class="cd">${p.c?esc(p.c):""}</div></div>
    <button class="dn" data-done="${i}">${DONE.has(p.v)?"✓ 済み":"済み"}</button></div>
    <div class="bw">${barMarkup(p,Math.min(window.innerWidth,520)-40,i===act?80:26,i!==act)}</div>
    <div class="num">${p.v}</div></div>`;
}
function mvRender(scroll){
  $("mvList").innerHTML=MV.map(mvCard).join("");
  $("mvTitle").textContent=`まとめて表示（${act+1} / ${MV.length}）　済み ${MV.filter(p=>DONE.has(p.v)).length}件`;
  $("mvPrev").disabled=act<=0;
  $("mvNext").textContent=act>=MV.length-1?"済みにする ✓":"済みにして次へ ▶";
  if(scroll){const el=$("mvList").querySelector(".mc.act");el&&el.scrollIntoView({block:"center"})}
}
function mvOpen(){
  MV=SEL.map(v=>ITEMS.find(p=>p.v===v)).filter(Boolean); if(!MV.length) return;
  act=0; DONE.clear(); $("multiView").classList.add("on"); mvRender(false); $("mvList").scrollTop=0;
  history.pushState({multi:1},""); keepAwake(true);
}
function mvClose(){$("multiView").classList.remove("on"); keepAwake(false); render(); updSel()}
$("selGo").onclick=mvOpen;
$("mvBack").onclick=()=>history.back();
$("mvList").addEventListener("click",e=>{
  const d=e.target.closest("[data-done]");
  if(d){const p=MV[+d.dataset.done];DONE.has(p.v)?DONE.delete(p.v):DONE.add(p.v);mvRender(false);return}
  const c=e.target.closest(".mc"); if(c&&+c.dataset.i!==act){act=+c.dataset.i;mvRender(true)}
});
$("mvPrev").onclick=()=>{if(act>0){act--;mvRender(true)}};
$("mvNext").onclick=()=>{DONE.add(MV[act].v);if(act<MV.length-1)act++;mvRender(true)};

/* ---------- バーコード画面 ---------- */
let lock=null;
async function keepAwake(on){
  try{
    if(on&&"wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}
    if(!on&&lock){await lock.release();lock=null}
  }catch(e){}
}
function show(){
  const p=view[cur];
  $("cvName").textContent=p.n;
  $("cvCode").textContent=p.c?`商品コード ${p.c}`:"";
  $("cvFlag").hidden=!p.f; $("cvFlag").innerHTML=p.f?`<b>要確認</b>　${esc(p.f)}`:"";
  $("cvNum").textContent=p.v;
  $("cvType").innerHTML={jan:'<span class="ty jan">JANコード</span>',fba:'<span class="ty fba">Amazon用（FNSKU）</span>',lgl:'<span class="ty lgl">ロジレスコード</span>'}[p.t];
  $("codeView").classList.toggle("fba",p.t==="fba"); $("codeView").classList.toggle("lgl",p.t==="lgl");
  if(p.t==="fba") drawC128(p.v); else drawEAN(p.v);
  $("prev").disabled=cur<=0; $("next").disabled=cur>=view.length-1;
  pushRecent(p.v);
}
function open(i){
  if(i<0||i>=view.length) return;
  cur=i; show(); $("codeView").classList.add("on");
  history.pushState({code:1},""); keepAwake(true);
}
function close(){ $("codeView").classList.remove("on"); keepAwake(false); render(); }
$("back").onclick=()=>history.back();
window.addEventListener("popstate",()=>{if($("codeView").classList.contains("on"))close();else if($("multiView").classList.contains("on"))mvClose()});
$("prev").onclick=()=>{if(cur>0){cur--;show()}};
$("next").onclick=()=>{if(cur<view.length-1){cur++;show()}};
window.addEventListener("resize",()=>{if(cur>=0&&$("codeView").classList.contains("on")){const p=view[cur];p.t==="fba"?drawC128(p.v):drawEAN(p.v)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&($("codeView").classList.contains("on")||$("multiView").classList.contains("on")))keepAwake(true)});
window.addEventListener("resize",()=>{if($("multiView").classList.contains("on"))mvRender(false)});

/* ---------- 読み込み ---------- */
async function load(){
  try{
    const r=await fetch("data.json",{cache:"no-store"}); const d=await r.json();
    ITEMS=d.items.map(p=>({...p,t:p.t||"jan"})).filter(p=>p.t==="fba"?validFn(p.v):validJan(p.v));
    // 同じ商品コードの番号・名前をまとめて、どの番号で検索しても全種類のバーコードが出るようにする
    const grp={}; ITEMS.forEach(p=>{if(p.c)(grp[p.c]=grp[p.c]||[]).push(p)});
    const TW={jan:"jan",fba:"amazon fnsku アマゾン",lgl:"logiless ロジレス"};
    ITEMS.forEach(p=>{const sib=p.c?grp[p.c]:[p];p.k=norm([p.c,...sib.map(x=>x.n+" "+x.v),TW[p.t]].join(" "))});
    // 商品ごとにまとめて、JAN → Amazon → ロジレス の順に並べる
    const first={}; ITEMS.forEach((p,i)=>{const g=p.c||("_"+i);if(!(g in first))first[g]=i});
    ITEMS=ITEMS.map((p,i)=>({p,g:first[p.c||("_"+i)],i})).sort((a,b)=>a.g-b.g||TORDER[a.p.t]-TORDER[b.p.t]||a.i-b.i).map(x=>x.p);
    $("meta").textContent=`データ ${d.updated}`;
    render();
  }catch(e){
    $("list").innerHTML=`<li class="empty">商品データを読み込めませんでした。<br>電波のある場所で、いちど開き直してください。</li>`;
  }
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
